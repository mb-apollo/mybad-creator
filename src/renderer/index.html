<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' mbc:; img-src 'self' mbc: data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' mbc:; script-src 'self' mbc: 'wasm-unsafe-eval' 'unsafe-eval' blob:; worker-src 'self' mbc: blob:; connect-src 'self' mbc: data: blob:">
<title>MyBad Creator</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="boot" class="boot"><img class="boot-logo" src="assets/logo-mark.svg" alt=""><span>MyBad Creator</span></div>

<div class="app" id="app" hidden>
  <header class="toolbar">
    <div class="tb-left">
      <div class="logo" aria-hidden="true"><img src="assets/logo-mark.svg" alt=""></div>
      <div class="proj"><span class="proj-app">MyBad Creator</span><span class="proj-name" id="projName">Sans titre</span></div>
      <span class="tb-sep"></span>
      <div class="seg" id="gameSeg" aria-label="Jeu"></div>
    </div>
    <div class="tb-center"><div class="seg" id="fmtSeg" aria-label="Format"></div></div>
    <div class="tb-right">
      <button class="icon-btn" id="btnUndo" title="Annuler (Ctrl+Z)" aria-label="Annuler"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
      <button class="icon-btn" id="btnRedo" title="Rétablir (Ctrl+Y)" aria-label="Rétablir"><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
      <span class="tb-sep"></span>
      <button class="ghost-btn update-btn" id="btnUpdate" hidden><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg><span>Mise à jour</span></button>
      <button class="ghost-btn" id="btnKit" title="Structure, rosters et ambiance repris dans chaque projet"><svg viewBox="0 0 24 24"><path d="M12 2 Q13 11 22 12 Q13 13 12 22 Q11 13 2 12 Q11 11 12 2Z"/></svg>Kit de marque</button>
      <button class="ghost-btn" id="btnCopy" title="Copier l'affiche dans le presse-papiers (Ctrl+Maj+C)"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg>Copier</button>
      <div class="export-group">
        <button class="primary-btn" id="btnExport"><svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>Exporter</button>
        <button class="primary-btn caret" id="btnExportMenu" aria-label="Options d'export"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
        <div class="menu" id="exportMenu" hidden>
          <div class="menu-label">Fichier</div>
          <div class="seg small" id="expType"><button data-v="png" class="on">PNG</button><button data-v="jpg">JPG</button></div>
          <div class="menu-label">Taille</div>
          <div class="seg small" id="expScale"><button data-v="1" class="on">Standard</button><button data-v="2">HD ×2</button></div>
          <button class="menu-item" id="btnExportAll">Exporter ce modèle dans les 3 formats…</button>
        </div>
      </div>
    </div>
  </header>

  <div class="work">
    <nav class="tools" id="tools" aria-label="Outils">
      <button data-tool="select" title="Sélection (V)" class="on"><svg viewBox="0 0 24 24"><path d="m4 3 7 17 2.5-7.5L21 10Z"/></svg></button>
      <button data-tool="hand" title="Main (H ou Espace)"><svg viewBox="0 0 24 24"><path d="M18 11V6a2 2 0 0 0-4 0v5M14 10V4a2 2 0 0 0-4 0v6M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.9-6-2.4l-3.6-3.6a2 2 0 0 1 2.8-2.8L7 15"/></svg></button>
      <span class="tsep"></span>
      <button data-tool="text" title="Texte (T)"><svg viewBox="0 0 24 24"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></svg></button>
      <button data-tool="rect" title="Rectangle (U)"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/></svg></button>
      <button data-tool="ellipse" title="Ellipse (O)"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="9" ry="7"/></svg></button>
      <button data-tool="line" title="Ligne (L)"><svg viewBox="0 0 24 24"><path d="M4 20 20 4"/></svg></button>
      <button data-tool="star" title="Étoile du Nord (S)"><svg viewBox="0 0 24 24"><path d="M12 2 Q13 11 22 12 Q13 13 12 22 Q11 13 2 12 Q11 11 12 2Z"/></svg></button>
      <span class="tsep"></span>
      <button data-add="image" title="Importer une image (Ctrl+I)"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg></button>
      <button data-add="agent" title="Render d'agent / de voiture"><svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/></svg></button>
      <button data-add="model" title="Modèle 3D"><svg viewBox="0 0 24 24"><path d="m12 2 9 5v10l-9 5-9-5V7Z"/><path d="m3 7 9 5 9-5M12 12v10"/></svg></button>
      <button data-add="emblem" title="Emblème MyBad"><svg viewBox="0 0 24 24"><path d="M3 5l7 6 1 8M21 5l-7 6-1 8M12 8v12"/></svg></button>
      <button data-add="glow" title="Halo lumineux"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
    </nav>

    <aside class="gallery" aria-label="Modèles">
      <div class="panel-title">Modèles</div>
      <div class="thumbs" id="thumbs"></div>
    </aside>

    <main class="stage" id="stage">
      <canvas id="poster"></canvas>
      <canvas id="overlay"></canvas>
      <div class="drop-hint" id="dropHint" hidden>Dépose ton image ou ton modèle 3D</div>
    </main>

    <aside class="side">
      <div class="side-top">
        <div class="tabs" role="tablist">
          <button data-tab="props" class="on">Propriétés</button>
          <button data-tab="content">Contenu</button>
          <button data-tab="theme">Thème</button>
          <button data-tab="library">Bibliothèque</button>
        </div>
        <div class="tabpane" data-pane="props" id="propsBody"></div>
        <div class="tabpane" data-pane="content" id="contentBody" hidden></div>
        <div class="tabpane" data-pane="theme" id="themeBody" hidden></div>
        <div class="tabpane" data-pane="library" id="libraryBody" hidden></div>
      </div>
      <div class="side-layers">
        <div class="layers-head"><span class="panel-title">Calques</span><span class="muted small" id="layersCount"></span></div>
        <div class="layers-list" id="layersList"></div>
        <div class="layers-foot" id="layersFoot">
          <div class="addwrap">
            <button class="icon-btn" data-lact="add" title="Ajouter un élément"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
            <div class="menu addmenu" id="addMenu" hidden>
              <div class="menu-label">Texte</div><div class="addlist"><button data-add="text">Texte</button><button data-add="script">Manuscrit</button><button data-add="label">Mention</button></div>
              <div class="menu-label">Formes</div><div class="addlist"><button data-add="pill">Cadre</button><button data-add="rect">Rectangle</button><button data-add="ellipse">Ellipse</button><button data-add="line">Ligne</button><button data-add="star">Étoile</button><button data-add="arrows">Flèches</button><button data-add="chevrons">Chevrons</button><button data-add="brackets">Coins</button><button data-add="slashes">Barres ////</button><button data-add="polygon">Polygone</button></div>
              <div class="menu-label">Images</div><div class="addlist"><button data-add="image">Importer</button><button data-add="agent">Render du jeu</button><button data-add="model">Modèle 3D</button><button data-add="emblem">Emblème MyBad</button></div>
              <div class="menu-label">Effets</div><div class="addlist"><button data-add="glow">Halo</button><button data-add="beam">Faisceau</button><button data-add="bigstar">Grande étoile</button><button data-add="stars">Étoiles</button><button data-add="streaks">Traînées</button><button data-add="bars">Barres</button><button data-add="constellation">Constellation</button><button data-add="grid">Grille</button><button data-add="vignette">Vignette</button><button data-add="grain">Grain</button></div>
            </div>
          </div>
          <button class="icon-btn" data-lact="up" title="Monter (Ctrl+])"><svg viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></svg></button>
          <button class="icon-btn" data-lact="down" title="Descendre (Ctrl+[)"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
          <button class="icon-btn" data-lact="dup" title="Dupliquer (Ctrl+D)"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg></button>
          <button class="icon-btn" data-lact="del" title="Supprimer (Suppr)"><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg></button>
        </div>
      </div>
    </aside>
  </div>

  <footer class="statusbar">
    <span id="stFmt"></span>
    <span id="stPos" class="st-pos"></span>
    <span class="st-tip">Double-clic sur un texte pour l'éditer · Espace + glisser pour déplacer la vue · F1 pour les raccourcis</span>
    <span class="zoom"><button class="icon-btn sm" id="zoomOut" aria-label="Zoom arrière">−</button><button class="zoom-val" id="zoomVal" title="Ajuster à la fenêtre">100 %</button><button class="icon-btn sm" id="zoomIn" aria-label="Zoom avant">+</button></span>
  </footer>
</div>

<div class="modal" id="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-head"><h2 id="modalTitle"></h2><button class="icon-btn" id="modalClose" aria-label="Fermer"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>
<div class="toasts" id="toasts"></div>
<input type="file" id="fileInput" hidden>
<script src="dist/app.js"></script>
</body>
</html>
