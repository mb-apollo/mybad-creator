# Publie automatiquement une nouvelle version de MyBad Creator
# dès que le numéro de version de package.json change sur la branche main.
name: Publier une version
on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version déjà publiée ?
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> $GITHUB_OUTPUT
          if gh release view "v$V" >/dev/null 2>&1; then echo "exists=true" >> $GITHUB_OUTPUT; else echo "exists=false" >> $GITHUB_OUTPUT; fi
      - uses: actions/setup-node@v4
        if: steps.check.outputs.exists == 'false'
        with:
          node-version: 20
          cache: npm
      - run: npm ci
        if: steps.check.outputs.exists == 'false'
      - run: npm run release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Installateur à tuiles pour la première installation (installer-ui/). Les mises à jour automatiques continuent d'utiliser
      # l'installateur NSIS ci-dessus (celui de latest.yml) : celui-ci est un fichier de plus dans la release, rien ne le remplace.
      # continue-on-error : la version est déjà publiée à ce stade, un souci avec ce fichier ne doit pas faire échouer la publication.
      - name: Installateur à tuiles
        if: steps.check.outputs.exists == 'false'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=${{ steps.check.outputs.version }}
          node installer-ui/build.js "release/MyBad-Creator-Setup-$V.exe"
          gh release upload "v$V" "release/MyBad-Creator-Installateur-$V.exe" --clobber
